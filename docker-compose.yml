services:
  service-main:
    build:
      context: ./service-main
    ports:
      - "8888:8888"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - services-network
  service-notification:
    build:
      context: ./service-notification
    ports:
      - "8082:8082"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
     service-main:
        condition: service_healthy
    networks:
      - services-network
  service-tasks:
    build:
      context: ./service-tasks
    ports:
      - "8081:8081"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      service-main:
        condition: service_healthy
      service-notification:
        condition: service_started
networks:
  service-network:
    driver: bridge